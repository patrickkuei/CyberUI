name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Type-check, Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --project=unit

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Check package integrity
        run: npm run check:package

      # Fails when the build breaks anything a 2.x user relies on (removed or
      # narrowed exports/props/CSS variables, consumer code that stopped
      # compiling). See CONTRIBUTING.md, "Compatibility and deprecation policy".
      - name: Check backward compatibility
        run: npm run check:compat

      # Fails when a breakpoint-prefixed class getResponsiveClasses() can build
      # (md:py-2 from size={{ base: 'sm', md: 'md' }}) is missing from the
      # built CSS, i.e. a responsive prop would silently do nothing (#108).
      - name: Check responsive classes are in the CSS
        run: npm run check:responsive-css

      - name: Check bundle size
        run: npm run size
